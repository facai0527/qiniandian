name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Check required website assets
        run: npm run check:assets

      - name: Build for this repository or custom domain
        run: npm run build
        env:
          QND_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
